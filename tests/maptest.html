<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>maptest</title>
<link rel="stylesheet" href="../css/app.css">
<style>#log{font:12px/1.5 monospace;white-space:pre-wrap;padding:14px;background:#fafafa;border-bottom:1px solid #ddd}</style>
</head>
<body>
<header class="topbar"><div class="topbar-in">
  <a class="brand" href="#/home">西综真题</a>
  <nav class="nav"><a href="#/years">按年份</a><a href="#/subjects">按科目</a><a href="#/build">组题</a><a href="#/mock">模拟题</a><a href="#/cases">病例</a><a href="#/maps">导图</a><a href="#/yicuo">易错</a><a href="#/lists">收藏/错题</a><a href="#/stats">统计</a></nav>
  <div class="topbar-r"><input id="q-search" class="search" placeholder="搜题干"><button class="icon-btn" id="btn-search">🔍</button><button class="icon-btn" id="btn-sync">☁</button><button class="icon-btn" id="btn-settings">⚙</button></div>
</div></header>
<pre id="log">running…</pre>
<main id="app" class="wrap"></main>
<div id="toast" class="toast" hidden></div>
<div id="drawer" class="drawer" hidden><div class="drawer-mask" data-close></div><aside class="drawer-panel"><header class="drawer-hd"><h2 id="drawer-title"></h2><button class="icon-btn" data-close>X</button></header><div id="drawer-body" class="drawer-bd"></div></aside></div>
<div id="modal" class="modal" hidden><div class="modal-mask" data-close></div><div class="modal-panel"><header class="modal-hd"><h2 id="modal-title"></h2><button class="icon-btn" data-close>X</button></header><div id="modal-body" class="modal-bd"></div><footer id="modal-foot" class="modal-ft"></footer></div></div>
<script>window.__errors=[];window.onerror=function(m,s,l){window.__errors.push(m+' @'+(s||'').split('/').pop()+':'+l);};</script>
<script src="../data/meta.js"></script><script src="../js/zip.js"></script><script src="../js/store.js"></script>
<script src="../js/bank.js"></script><script src="../js/card.js"></script><script src="../js/mapview.js"></script><script src="../js/session.js"></script>
<script src="../js/views.js"></script><script src="../js/app.js"></script>
<script>
(async function () {
  const lines = []; let fail = 0;
  const log = () => { document.getElementById('log').textContent = lines.join('\n'); };
  function ok(n, c, e) { lines.push((c ? '[PASS] ' : '[FAIL] ') + n + (e != null ? '  — ' + e : '')); if (!c) fail++; log(); }
  const wait = ms => new Promise(r => setTimeout(r, ms));
  const $ = s => document.querySelector(s);
  const $$ = s => Array.prototype.slice.call(document.querySelectorAll(s));

  await Store.init();
  for (let i = 0; i < 120 && !$('.hero'); i++) await wait(50);
  await Bank.ensureMaps();
  ok('maps loaded', Bank.mapPages().length === 272, Bank.mapPages().length + ' pages');
  ok('toc loaded', Bank.mapToc().length === 5, Bank.mapToc().map(t => t.t).join('/'));

  // 导图页
  location.hash = '#/maps'; await wait(1200);
  ok('maps view toc', $$('[data-goto]').length > 100, $$('[data-goto]').length + ' entries');
  ok('viewer image', !!$('img.mv-img'), $('img.mv-img') && $('img.mv-img').getAttribute('src'));
  const firstPos = $('.mv-pos') ? $('.mv-pos').textContent : '';
  // 点目录跳页
  const target = $$('[data-goto]').filter(a => +a.dataset.goto > 30)[0];
  target.click(); await wait(900);
  const newPos = $('.mv-pos') ? $('.mv-pos').textContent : '';
  ok('toc jumps page', firstPos !== newPos, firstPos + ' -> ' + newPos);

  // 搜索导图
  const inp = $('[data-mapsearch]');
  inp.value = '心衰';
  inp.dispatchEvent(new Event('input', { bubbles: true }));
  await wait(700);
  ok('map search hits', $$('[data-hit]').length > 0, $$('[data-hit]').length + ' hits');
  if ($$('[data-hit]').length) {
    $$('[data-hit]')[0].click(); await wait(700);
    ok('search jumps', !!$('.mv-pos'), $('.mv-pos') && $('.mv-pos').textContent);
  } else { ok('search jumps', false, 'no hits'); }

  // 图上手写
  const wrap = $('.mv-wrap');
  const cv = wrap.querySelector('canvas.mv-hw');
  wrap.classList.add('mv-draw');
  const r = cv.getBoundingClientRect();
  cv.dispatchEvent(new PointerEvent('pointerdown', { bubbles: true, clientX: r.left + 60, clientY: r.top + 60, pointerId: 9 }));
  cv.dispatchEvent(new PointerEvent('pointermove', { bubbles: true, clientX: r.left + 160, clientY: r.top + 120, pointerId: 9 }));
  cv.dispatchEvent(new PointerEvent('pointerup', { bubbles: true, clientX: r.left + 160, clientY: r.top + 120, pointerId: 9 }));
  await wait(300);
  const pageNo = +($('.mv-pos').textContent.match(/(\d+)/) || [0, 0])[1];
  const hw = Store.hw('MAP:' + pageNo);
  ok('map handwriting stored', !!hw && hw.s.length === 1, 'page=' + pageNo + ' ' + (hw ? hw.s.length : 'null'));

  // 导图笔记
  const ta = $('.mv-note-ta');
  ta.value = '这一页重点：心衰用药顺序';
  ta.dispatchEvent(new Event('input', { bubbles: true }));
  await wait(800);
  ok('map note stored', !!(Store.note('MAP:' + pageNo) && Store.note('MAP:' + pageNo).blocks[0].v.indexOf('心衰') >= 0));

  // 题目里打开导图
  await Bank.ensure(['生理学']);
  const q = Bank.loaded['生理学'].filter(x => x.ci === 0)[0];
  const pages = Bank.mapPagesForQuestion(q);
  ok('question map match', pages.length > 0, pages.length + ' pages for 章 ' + Bank.chapterMeta(q.subj, q.ci).t);
  Session.start({ title: 'maptest', items: [Bank.itemOf(q)] });
  await wait(300);
  let card = $('.card');
  ok('map button', !!card.querySelector('[data-act="map"]'));
  card.querySelector('[data-act="map"]').click(); await wait(300);
  ok('map dialog', !$('#modal').hidden, $('#modal-title').textContent);
  const btnInline = $$('#modal-body .btn').filter(b => /下方/.test(b.textContent))[0];
  btnInline.click(); await wait(600);
  ok('inline map shown', $$('.map-inline .map-fig img').length > 0, $$('.map-inline .map-fig img').length + ' imgs');
  // 侧边
  card.querySelector('[data-act="map"]').click(); await wait(300);
  const btnSide = $$('#modal-body .btn').filter(b => /侧边/.test(b.textContent))[0];
  btnSide.click(); await wait(800);
  ok('side drawer', !$('#drawer').hidden && $('.drawer-panel').classList.contains('wide'), $('.drawer-panel').className);
  U.closeDrawer(); await wait(300);

  // 关联
  card.querySelector('[data-act="link"]').click(); await wait(600);
  ok('link dialog', !$('#modal').hidden);
  const lkInp = $('[data-lk]');
  lkInp.value = '心动周期';
  lkInp.dispatchEvent(new Event('input', { bubbles: true }));
  await wait(1200);
  const lkBtn = $('[data-lkt]');
  ok('link results', !!lkBtn, $$('[data-lkt]').length + ' results');
  if (lkBtn) {
    const otherId = lkBtn.dataset.lkt;
    lkBtn.click(); await wait(300);
    ok('link stored', Store.linksOf(q.id).indexOf(otherId) >= 0, Store.linksOf(q.id).join(','));
    ok('link bidirectional', Store.linksOf(otherId).indexOf(q.id) >= 0, '');
    U.closeModal(); await wait(300);
    ok('link chips on card', $$('.link-chip').length === 1, $$('.link-chip').length + '');
    $$('.link-chip')[0].click(); await wait(400);
    ok('chip opens question', !$('#modal').hidden, $('#modal-title').textContent);
    U.closeModal();
  }

  // 病例题专项：图按钮要能找到导图（地图是懒加载的）
  Session.teardown(); await wait(60);
  await Bank.ensure(['内科学']);
  const cq = Bank.loaded['内科学'].filter(function (q) { return q.clus; })[0];
  Session.start({ title: 'case-map', items: [Bank.itemOf(cq)] });
  await wait(300);
  const cCard = $('.card');
  cCard.querySelector('[data-act="map"]').click();
  await wait(700);
  const hintTxt = $('#modal-body [data-mp-hint]') ? $('#modal-body [data-mp-hint]').textContent : '';
  ok('case map dialog finds pages', /找到这一章对应的导图/.test(hintTxt), hintTxt);
  const okBtn = $$('#modal-body .btn').filter(b => !b.disabled && /下方/.test(b.textContent))[0];
  ok('map buttons enabled', !!okBtn, okBtn ? 'enabled' : 'disabled');
  U.closeModal();
  Session.teardown();

  lines.push(''); lines.push('JS errors: ' + (window.__errors.join(' | ') || 'none'));
  lines.push(fail ? 'FAILED ' + fail : 'ALL PASS');
  log();
  document.title = fail ? 'FAIL ' + fail : 'OK';
})();
</script>
</body>
</html>
