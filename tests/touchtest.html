<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><title>touchtest</title>
<link rel="stylesheet" href="../css/app.css">
<style>#log{font:12px/1.5 monospace;white-space:pre-wrap;padding:14px;background:#fafafa;border-bottom:1px solid #ddd}</style></head>
<body>
<header class="topbar"><div class="topbar-in"><a class="brand" href="#/home">西综真题</a>
<nav class="nav"><a href="#/years">按年份</a><a href="#/subjects">按科目</a><a href="#/build">组题</a><a href="#/mock">模拟题</a><a href="#/cases">病例</a><a href="#/maps">导图</a><a href="#/yicuo">易错</a><a href="#/lists">收藏/错题</a><a href="#/stats">统计</a></nav>
<div class="topbar-r"><input id="q-search" class="search"><button class="icon-btn" id="btn-search">S</button><button class="icon-btn" id="btn-sync">C</button><button class="icon-btn" id="btn-settings">G</button></div></div></header>
<pre id="log">running…</pre>
<main id="app" class="wrap"></main><div id="toast" class="toast" hidden></div>
<div id="drawer" class="drawer" hidden><div class="drawer-mask" data-close></div><aside class="drawer-panel"><header class="drawer-hd"><h2 id="drawer-title"></h2><button class="icon-btn" data-close>X</button></header><div id="drawer-body" class="drawer-bd"></div></aside></div>
<div id="modal" class="modal" hidden><div class="modal-mask" data-close></div><div class="modal-panel"><header class="modal-hd"><h2 id="modal-title"></h2><button class="icon-btn" data-close>X</button></header><div id="modal-body" class="modal-bd"></div><footer id="modal-foot" class="modal-ft"></footer></div></div>
<script>window.__errors=[];window.onerror=function(m,s,l){window.__errors.push(m+' @'+(s||'').split('/').pop()+':'+l);};</script>
<script src="../data/meta.js"></script><script src="../js/zip.js"></script><script src="../js/store.js"></script>
<script src="../js/bank.js"></script><script src="../js/card.js"></script><script src="../js/mapview.js"></script><script src="../js/session.js"></script>
<script src="../js/views.js"></script><script src="../js/app.js"></script>
<script>
(async function(){
  const lines=[]; let fail=0;
  const log=()=>{document.getElementById('log').textContent=lines.join('\n');};
  function ok(n,c,e){lines.push((c?'[PASS] ':'[FAIL] ')+n+(e!=null?'  — '+e:'')); if(!c)fail++; log();}
  const wait=ms=>new Promise(r=>setTimeout(r,ms));
  const $=s=>document.querySelector(s);
  await Store.init();
  for(let i=0;i<120 && !$('.hero');i++) await wait(50);
  await Bank.ensure(['生理学']);
  Session.start({title:'touch', items:[Bank.itemOf(Bank.loaded['生理学'][0])]});
  await wait(300);
  const stem = $('.stem');
  const r = stem.getBoundingClientRect();
  const x = r.left + 30, y = r.top + 12;
  function touch(el, type, x2, y2){
    const t = new Touch({identifier: 1, target: el, clientX: x2, clientY: y2, pageX: x2, pageY: y2});
    el.dispatchEvent(new TouchEvent(type, {bubbles:true, cancelable:true, touches: type==='touchend'?[]:[t], targetTouches: type==='touchend'?[]:[t], changedTouches:[t]}));
  }
  touch(stem, 'touchstart', x, y);
  await wait(700);
  const sel = window.getSelection();
  ok('long-press selects text', sel && !sel.isCollapsed, sel ? JSON.stringify(sel.toString().slice(0,20)) : 'null');
  const tools = document.querySelector('.float-tools');
  ok('toolbar shown', !!tools && tools.querySelectorAll('button').length >= 2, tools ? (tools.querySelectorAll('button').length + ' buttons') : 'none');
  // 拖动扩展
  touch(stem, 'touchmove', x + 80, y + 6);
  await wait(150);
  const sel2 = window.getSelection();
  ok('drag extends selection', sel2 && sel2.toString().length >= (sel ? sel.toString().length : 0), sel2 ? sel2.toString().slice(0,24) : '');
  touch(stem, 'touchend', x + 80, y + 6);
  await wait(150);
  // 点高亮
  const hl = Array.prototype.slice.call(document.querySelectorAll('.float-tools button')).filter(b=>/高亮/.test(b.textContent))[0];
  ok('highlight button exists', !!hl);
  if (hl) { hl.click(); await wait(200); ok('highlight created', !!$('mark.hl') || !!$('.mark-hl') || document.querySelectorAll('mark').length>0, document.querySelectorAll('mark').length+''); }
  lines.push(''); lines.push('JS errors: '+(window.__errors.join(' | ')||'none'));
  lines.push(fail?'FAILED '+fail:'ALL PASS');
  log(); document.title = fail?'FAIL '+fail:'OK';
})();
</script></body></html>
