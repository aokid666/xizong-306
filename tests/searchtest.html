<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>searchtest</title>
<link rel="stylesheet" href="../css/app.css">
<style>#log{font:12px/1.5 monospace;white-space:pre-wrap;padding:14px;background:#fafafa;border-bottom:1px solid #ddd}</style>
</head>
<body>
<header class="topbar"><div class="topbar-in">
  <a class="brand" href="#/home">西综真题</a>
  <nav class="nav"><a href="#/years">按年份</a><a href="#/subjects">按科目</a><a href="#/build">组题</a><a href="#/mock">模拟题</a><a href="#/yicuo">易错</a><a href="#/lists">收藏/错题</a><a href="#/stats">统计</a></nav>
  <div class="topbar-r"><input id="q-search" class="search" placeholder="搜题干"><button class="icon-btn" id="btn-search">🔍</button><button class="icon-btn" id="btn-sync">☁</button><button class="icon-btn" id="btn-settings">⚙</button></div>
</div></header>
<pre id="log">running…</pre>
<main id="app" class="wrap"></main>
<div id="toast" class="toast" hidden></div>
<div id="drawer" class="drawer" hidden><div class="drawer-mask" data-close></div><aside class="drawer-panel"><header class="drawer-hd"><h2 id="drawer-title"></h2><button class="icon-btn" data-close>X</button></header><div id="drawer-body" class="drawer-bd"></div></aside></div>
<div id="modal" class="modal" hidden><div class="modal-mask" data-close></div><div class="modal-panel"><header class="modal-hd"><h2 id="modal-title"></h2><button class="icon-btn" data-close>X</button></header><div id="modal-body" class="modal-bd"></div><footer id="modal-foot" class="modal-ft"></footer></div></div>
<script>window.__errors=[];window.onerror=function(m,s,l){window.__errors.push(m+' @'+(s||'').split('/').pop()+':'+l);};</script>
<script src="../data/meta.js"></script><script src="../js/zip.js"></script><script src="../js/store.js"></script>
<script src="../js/bank.js"></script><script src="../js/card.js"></script><script src="../js/session.js"></script>
<script src="../js/views.js"></script><script src="../js/app.js"></script>
<script>
(async function () {
  const lines = []; let fail = 0;
  const log = () => { document.getElementById('log').textContent = lines.join('\n'); };
  function ok(n, c, e) { lines.push((c ? '[PASS] ' : '[FAIL] ') + n + (e != null ? '  — ' + e : '')); if (!c) fail++; log(); }
  const wait = ms => new Promise(r => setTimeout(r, ms));
  const $ = s => document.querySelector(s);
  const $$ = s => Array.prototype.slice.call(document.querySelectorAll(s));

  await Store.init();
  for (let i = 0; i < 120 && !$('.hero'); i++) await wait(50);

  // 搜索：默认范围
  location.hash = '#/search/' + encodeURIComponent('前馈');
  await wait(3000);
  const cnt1 = ($('[data-count]') || {}).textContent || '';
  ok('search filters rendered', $$('.sf-row').length >= 4, $$('.sf-row').length + ' rows');
  ok('search count text', /真题 \d+/.test(cnt1), cnt1);
  const rows1 = $$('#search-body .row').length;
  ok('search has results', rows1 > 0, rows1 + '');

  // 切到「模拟题」
  const mockBtn = $$('.seg[data-fs="scope"] button').filter(b => b.dataset.v === 'mock')[0];
  mockBtn.click();
  await wait(600);
  const cnt2 = ($('[data-count]') || {}).textContent || '';
  ok('scope=mock only mock', /真题 0 · 模拟题 \d+/.test(cnt2), cnt2);
  const bodyTxt = ($('#search-body') || {}).textContent || '';
  ok('mock rows present', $$('#search-body .row').length > 0 && bodyTxt.indexOf('模拟') >= 0, $$('#search-body .row').length + '');

  // 切到「真题」
  const realBtn = $$('.seg[data-fs="scope"] button').filter(b => b.dataset.v === 'real')[0];
  realBtn.click();
  await wait(600);
  const cnt3 = ($('[data-count]') || {}).textContent || '';
  ok('scope=real only real', /模拟题 0/.test(cnt3), cnt3);

  // 字段：只搜解析
  const fExp = $('[data-ff="exp"]');
  const fStem = $('[data-ff="stem"]');
  const fOpts = $('[data-ff="opts"]');
  fStem.checked = false; fOpts.checked = false; fExp.checked = true;
  fExp.dispatchEvent(new Event('change', { bubbles: true }));
  await wait(800);
  ok('field=exp works', $$('#search-body .row').length > 0, $$('#search-body .row').length + ' rows');
  fStem.checked = true; fOpts.checked = true;
  fStem.dispatchEvent(new Event('change', { bubbles: true }));
  await wait(600);

  // 科目筛选
  const chip = $('[data-subj="生理学"]');
  chip.click();
  await wait(700);
  const cnt4 = ($('[data-count]') || {}).textContent || '';
  ok('subject filter applied', /命中 \d+/.test(cnt4), cnt4);
  chip.click(); await wait(500);

  // 年份筛选（真题）
  const yf = $('[data-yfrom]');
  yf.value = '2020';
  yf.dispatchEvent(new Event('change', { bubbles: true }));
  await wait(700);
  ok('year filter applied', /命中 \d+/.test(($('[data-count]') || {}).textContent || ''), ($('[data-count]') || {}).textContent);

  // 收藏一道模拟题 → 收藏列表里能看到
  await Bank.ensureMock();
  const mq = Bank.mock.list[0];
  Store.toggleFav(mq.id);
  location.hash = '#/lists'; await wait(2500);
  const listTxt = ($('#list-body') || {}).textContent || '';
  ok('mock favorite in list', listTxt.indexOf('模拟') >= 0, listTxt.slice(0, 60));
  ok('list has rows', $$('#list-body .row').length > 0, $$('#list-body .row').length + '');

  // 统计页有模拟题一行
  location.hash = '#/stats'; await wait(3500);
  const stTxt = ($('#app') || {}).textContent || '';
  ok('stats has mock row', stTxt.indexOf('模拟题') >= 0, '');

  lines.push(''); lines.push('JS errors: ' + (window.__errors.join(' | ') || 'none'));
  lines.push(fail ? 'FAILED ' + fail : 'ALL PASS');
  log();
  document.title = fail ? 'FAIL ' + fail : 'OK';
})();
</script>
</body>
</html>
