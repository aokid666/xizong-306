<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>hwtest</title>
<link rel="stylesheet" href="../css/app.css">
<style>#log{font:12px/1.5 monospace;white-space:pre-wrap;padding:14px;background:#fafafa;border-bottom:1px solid #ddd}</style>
</head>
<body>
<header class="topbar"><div class="topbar-in">
  <a class="brand" href="#/home">西综真题</a>
  <nav class="nav"><a href="#/years">按年份</a><a href="#/subjects">按科目</a><a href="#/build">组题</a><a href="#/mock">模拟题</a><a href="#/yicuo">易错</a><a href="#/lists">收藏/错题</a><a href="#/stats">统计</a></nav>
  <div class="topbar-r"><input id="q-search" class="search" placeholder="搜题干"><button class="icon-btn" id="btn-search">🔍</button><button class="icon-btn" id="btn-sync">☁</button><button class="icon-btn" id="btn-settings">⚙</button></div>
</div></header>
<pre id="log">running…</pre>
<main id="app" class="wrap"></main>
<div id="toast" class="toast" hidden></div>
<div id="drawer" class="drawer" hidden><div class="drawer-mask" data-close></div><aside class="drawer-panel"><header class="drawer-hd"><h2 id="drawer-title"></h2><button class="icon-btn" data-close>X</button></header><div id="drawer-body" class="drawer-bd"></div></aside></div>
<div id="modal" class="modal" hidden><div class="modal-mask" data-close></div><div class="modal-panel"><header class="modal-hd"><h2 id="modal-title"></h2><button class="icon-btn" data-close>X</button></header><div id="modal-body" class="modal-bd"></div><footer id="modal-foot" class="modal-ft"></footer></div></div>
<script>window.__errors=[];window.onerror=function(m,s,l){window.__errors.push(m+' @'+(s||'').split('/').pop()+':'+l);};</script>
<script src="../data/meta.js"></script><script src="../js/zip.js"></script><script src="../js/store.js"></script>
<script src="../js/bank.js"></script><script src="../js/card.js"></script><script src="../js/session.js"></script>
<script src="../js/views.js"></script><script src="../js/app.js"></script>
<script>
(async function () {
  const lines = []; let fail = 0;
  const log = () => { document.getElementById('log').textContent = lines.join('\n'); };
  function ok(n, c, e) { lines.push((c ? '[PASS] ' : '[FAIL] ') + n + (e != null ? '  — ' + e : '')); if (!c) fail++; log(); }
  const wait = ms => new Promise(r => setTimeout(r, ms));
  const $ = s => document.querySelector(s);

  await Store.init();
  for (let i = 0; i < 120 && !$('.hero'); i++) await wait(50);
  await Bank.ensure(['生理学']);

  const q = Bank.loaded['生理学'][0];
  Session.start({ title: 'hw', items: [Bank.itemOf(q)] });
  await wait(250);
  let card = $('.card');
  const qid = card._item.qs[0].id;

  // 进入手写
  card.querySelector('[data-act="hw"]').click();
  await wait(120);
  ok('hw on', card.classList.contains('hw-on'));

  const cv = card.querySelector('canvas.hw-layer');
  const r0 = cv.getBoundingClientRect();
  const send = (type, x, y) => cv.dispatchEvent(new PointerEvent(type, { bubbles: true, clientX: r0.left + x, clientY: r0.top + y, pointerId: 3 }));
  send('pointerdown', 40, 40); send('pointermove', 120, 80); send('pointerup', 120, 80);
  await wait(150);
  const d1 = Store.hw(qid);
  ok('stroke drawn', !!d1 && d1.s.length === 1, d1 && JSON.stringify(d1).slice(0, 60));
  const oldW = d1.w;

  // 打开笔记 → 卡片变高 → 画布重新缩放
  card.querySelector('.card-acts [data-act="note"]').click();
  await wait(400);
  ok('note opened', !!card.querySelector('.note-wrap[data-open="1"]'));
  const newW = cv._lw;
  ok('canvas resized', newW !== oldW || cv._lh > 0, 'oldW=' + oldW + ' newW=' + newW);

  // 笔记面板应盖在手写层上：点输入框能聚焦
  const ta = card.querySelector('.note-wrap[data-open="1"] .nb-text');
  const r = ta.getBoundingClientRect();
  document.elementFromPoint(r.left + 20, r.top + 10);
  ta.focus();
  ok('note clickable above canvas', document.activeElement === ta, document.activeElement && document.activeElement.tagName);

  // 橡皮：按缩放后的坐标擦
  const eraseBtn = card.querySelector('[data-hw="eraser"]');
  eraseBtn.click();
  await wait(80);
  const scale = newW / oldW;
  const rr = cv.getBoundingClientRect();
  const ex = (40 + 80) / 2 * scale, ey = (40 + 80) / 2 * scale;
  cv.dispatchEvent(new PointerEvent('pointerdown', { bubbles: true, clientX: rr.left + ex, clientY: rr.top + ey, pointerId: 4 }));
  await wait(200);
  const d2 = Store.hw(qid);
  ok('stroke erased after resize', !d2 || d2.s.length === 0, d2 ? ('strokes=' + d2.s.length) : 'deleted');
  ok('canvas cleared', true);

  lines.push(''); lines.push('JS errors: ' + (window.__errors.join(' | ') || 'none'));
  lines.push(fail ? 'FAILED ' + fail : 'ALL PASS');
  log();
  document.title = fail ? 'FAIL ' + fail : 'OK';
})();
</script>
</body>
</html>
