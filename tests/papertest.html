<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>papertest</title>
<link rel="stylesheet" href="../css/app.css">
<style>#log{font:12px/1.5 monospace;white-space:pre-wrap;padding:14px;background:#fafafa;border-bottom:1px solid #ddd}</style>
</head>
<body>
<header class="topbar"><div class="topbar-in">
  <a class="brand" href="#/home">西综真题</a>
  <nav class="nav"><a href="#/years">按年份</a><a href="#/subjects">按科目</a><a href="#/build">组题</a><a href="#/mock">模拟题</a><a href="#/yicuo">易错</a><a href="#/lists">收藏/错题</a><a href="#/stats">统计</a></nav>
  <div class="topbar-r"><input id="q-search" class="search" placeholder="搜题干"><button class="icon-btn" id="btn-search">🔍</button><button class="icon-btn" id="btn-sync">☁</button><button class="icon-btn" id="btn-settings">⚙</button></div>
</div></header>
<pre id="log">running…</pre>
<main id="app" class="wrap"></main>
<div id="toast" class="toast" hidden></div>
<div id="drawer" class="drawer" hidden><div class="drawer-mask" data-close></div><aside class="drawer-panel"><header class="drawer-hd"><h2 id="drawer-title"></h2><button class="icon-btn" data-close>X</button></header><div id="drawer-body" class="drawer-bd"></div></aside></div>
<div id="modal" class="modal" hidden><div class="modal-mask" data-close></div><div class="modal-panel"><header class="modal-hd"><h2 id="modal-title"></h2><button class="icon-btn" data-close>X</button></header><div id="modal-body" class="modal-bd"></div><footer id="modal-foot" class="modal-ft"></footer></div></div>
<script>window.__errors=[];window.onerror=function(m,s,l){window.__errors.push(m+' @'+(s||'').split('/').pop()+':'+l);};</script>
<script src="../data/meta.js"></script><script src="../js/zip.js"></script><script src="../js/store.js"></script>
<script src="../js/bank.js"></script><script src="../js/card.js"></script><script src="../js/session.js"></script>
<script src="../js/views.js"></script><script src="../js/app.js"></script>
<script>
(async function () {
  const lines = []; let fail = 0;
  const log = () => { document.getElementById('log').textContent = lines.join('\n'); };
  function ok(n, c, e) { lines.push((c ? '[PASS] ' : '[FAIL] ') + n + (e != null ? '  — ' + e : '')); if (!c) fail++; log(); }
  const wait = ms => new Promise(r => setTimeout(r, ms));
  const $ = s => document.querySelector(s);
  const $$ = s => Array.prototype.slice.call(document.querySelectorAll(s));

  await Store.init();
  for (let i = 0; i < 120 && !$('.hero'); i++) await wait(50);

  /* ---------- 组题：自定义名称 + 历史 ---------- */
  location.hash = '#/build'; await wait(400);
  const nameInput = $('[data-paper-name]');
  ok('name input exists', !!nameInput);
  nameInput.value = '我的循环专项';
  $('[data-count]').value = '4';
  $('[data-act="go"]').click();
  for (let i = 0; i < 150 && !$('.session-bar'); i++) await wait(50);
  ok('session started', !!$('.session-bar'), $('.session-bar') && $('.session-bar .session-title').textContent);
  ok('title is custom name', /我的循环专项/.test($('.session-title').textContent), $('.session-title').textContent);

  const papers = Store.papers();
  ok('paper saved', papers.length === 1 && papers[0].name === '我的循环专项', JSON.stringify(papers.map(p => p.name)));
  ok('paper items', papers[0].items.length === 4, papers[0].items.length + '');
  ok('paper filters', !!papers[0].filters, papers[0].filters);
  Session.teardown(); await wait(80);

  // 历史列表
  location.hash = '#/build'; await wait(500);
  const rows = $$('[data-paper]');
  ok('paper row rendered', rows.length === 1, rows.length + '');
  ok('paper row shows name', rows.length && rows[0].textContent.indexOf('我的循环专项') >= 0);
  ok('paper row shows progress', rows.length && /已做 \d+/.test(rows[0].textContent), rows[0] && rows[0].textContent.trim().slice(0, 60));

  // 重命名
  $('[data-pname]').click(); await wait(200);
  ok('rename dialog', !$('#modal').hidden, $('#modal-title').textContent);
  $('#modal-body input').value = '改名后的题单';
  $$('#modal-foot .btn').filter(b => b.textContent === '保存')[0].click();
  await wait(300);
  ok('renamed', Store.papers()[0].name === '改名后的题单', Store.papers()[0].name);

  // 打开题单
  $('[data-pgo]').click();
  for (let i = 0; i < 150 && !$('.session-bar'); i++) await wait(50);
  ok('paper reopened', !!$('.session-bar'), $('.session-bar') && $('.session-title').textContent);
  ok('paper item count kept', Session.S.items.length === 4, Session.S.items.length + '');
  Session.teardown(); await wait(80);

  // 删除
  location.hash = '#/build'; await wait(500);
  $('[data-pdel]').click(); await wait(200);
  $$('#modal-foot .btn').filter(b => b.textContent === '删除')[0].click();
  await wait(300);
  ok('paper deleted', Store.papers().length === 0, Store.papers().length + '');

  /* ---------- 科目章节课时按年份筛选 ---------- */
  Store.set('subjFrom', 0); Store.set('subjTo', 9999);
  location.hash = '#/subject/' + encodeURIComponent('生理学'); await wait(800);
  ok('year selects', !!$('[data-yr="from"]'), '');
  const totalAll = $$('details.tree-ch').map(d => +d.querySelector('.meta').textContent.replace(/[^\d]/g, ''));
  const sumAll = totalAll.reduce((a, b) => a + b, 0);
  ok('all-year counts', sumAll > 1000, sumAll + '');

  // 选一个年份区间：2020-2026
  $('[data-yr="from"]').value = '2026';
  $('[data-yr="from"]').dispatchEvent(new Event('change', { bubbles: true }));
  await wait(500);
  const sumRange = $$('details.tree-ch').map(d => +d.querySelector('.meta').textContent.replace(/[^\d]/g, '')).reduce((a, b) => a + b, 0);
  ok('range reduces counts', sumRange > 0 && sumRange < sumAll, sumAll + ' -> ' + sumRange);
  const dimmed = $$('details.tree-ch.dim').length;
  ok('empty chapters dimmed', dimmed > 0, dimmed + ' / ' + $$('details.tree-ch').length);

  // 点一个灰掉的章：不应开始
  const dimCh = $('details.tree-ch.dim');
  if (dimCh) {
    const btn = dimCh.querySelector('[data-ch]');
    ok('dim chapter button disabled', btn && btn.disabled, btn ? ('disabled=' + btn.disabled) : 'no btn');
  }

  // 刷一个范围内有题的章，检查题量一致
  const live = $$('details.tree-ch:not(.dim)')[0];
  const expect = +live.querySelector('.meta').textContent.replace(/[^\d]/g, '');
  live.querySelector('[data-ch]').click();
  for (let i = 0; i < 150 && !$('.session-bar'); i++) await wait(50);
  ok('chapter session respects range', Session.S.items.length <= expect, 'items=' + Session.S.items.length + ' expect<=' + expect);
  ok('chapter session all in range', Session.S.items.every(it => it.qs.every(q => q.y >= 2026)), '');
  Session.teardown();

  lines.push(''); lines.push('JS errors: ' + (window.__errors.join(' | ') || 'none'));
  lines.push(fail ? 'FAILED ' + fail : 'ALL PASS');
  log();
  document.title = fail ? 'FAIL ' + fail : 'OK';
})();
</script>
</body>
</html>
